name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_PATH: 'Win11 Extra Clock.csproj'
      NSIS_SCRIPT: 'installer/nsis/installer.nsi'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
            $v = $tag.TrimStart('v')
          }
          if (-not $v) { throw "Version could not be determined." }
          echo "NUM=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Restore & Publish (win-x64)
        shell: pwsh
        run: |
          dotnet restore
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r win-x64 `
            -p:SelfContained=true -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:UseAppHost=true `
            -o out\publish

# Installer

      - name: List publish output (location + files)
        shell: pwsh
        run: |
          Write-Host "Repo root: $PWD"
          $p = Resolve-Path "out\publish"
          Write-Host "Publish folder: $p"
          Get-ChildItem $p -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Detect EXE name
        id: props
        shell: pwsh
        run: |
          $asm = (dotnet msbuild "${{ env.PROJECT_PATH }}" -getProperty:AssemblyName).Trim()
          if (-not $asm) { $asm = "Win11 Extra Clock" }
          $exe = Join-Path (Resolve-Path "out\publish") "$asm.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "Expected EXE not found at: $exe"
            throw "App EXE not found. Ensure <OutputType>WinExe</OutputType> and <UseAppHost>true</UseAppHost> in csproj."
          }
          echo "ASM=$asm" >> $env:GITHUB_OUTPUT

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          wix --version
          wix extension add WixToolset.UI.wixext
          wix extension add WixToolset.Util.wixext
        # https://docs.firegiant.com/wix/tools/wixexe/

      - name: Build MSI (WiX 5)
        shell: pwsh
        run: |
          $PubDir  = (Resolve-Path "$PWD\out\publish").Path
          $MsiOut  = "$PWD\dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}.msi"
          New-Item -ItemType Directory -Force -Path (Split-Path $MsiOut) | Out-Null

          # repo res
          $License = (Resolve-Path "$PWD\installer\assets\license.rtf").Path
          $Icon    = (Resolve-Path "$PWD\installer\assets\win11_extra_clock_icon.ico" -ErrorAction SilentlyContinue)

          $iconArg = ""
          if ($Icon) { $iconArg = "-define AppIconPath=`"$Icon`"" }

          wix build installer\wix\Product.wxs installer\wix\Files.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -define ProductVersion="${{ steps.v.outputs.NUM }}" `
            -define AppExeName="${{ steps.props.outputs.ASM }}.exe" `
            -define LicenseRtf="$License" `
            -bindpath Publish="$PubDir" `
            -v diagnostic `
            -o "$MsiOut"

          Write-Host "MSI built at:"
          Get-Item "$MsiOut" | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Generate MSI checksum & upload dist
        shell: pwsh
        run: |
          $msi = Get-Item "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}.msi"
          $hash = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash
          "$hash  $($msi.Name)" | Out-File -Encoding ASCII "$($msi.FullName).sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

# Release
  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "NUM=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "NUM=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.v.outputs.NUM }}
          name: Win11 Extra Clock ${{ steps.v.outputs.NUM }}
          generate_release_notes: true
          make_latest: true
          draft: false
          files: |
            dist/Win11ExtraClock-x64-*-setup.exe
            dist/Win11ExtraClock-x64-*-setup.exe.sha256.txt
