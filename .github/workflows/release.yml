name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_PATH: 'Win11 Extra Clock.csproj'
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: v
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "NUM=$v" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify versions (tag vs csproj vs version.txt)
        shell: pwsh
        run: |
          $tag = "${{ steps.v.outputs.NUM }}"
          $proj = [xml](Get-Content "${{ env.PROJECT_PATH }}")
          $csprojVer = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          $txt = (Get-Content "version.txt" -Raw).Trim()
          Write-Host "Tag: $tag  |  csproj: $csprojVer  |  version.txt: $txt"
          if ($csprojVer -ne $tag -or $txt -ne $tag) {
            Write-Error "Version mismatch. Keep tag, csproj <Version>, and version.txt identical."; exit 1
          }

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o out/publish

      - name: Install WiX Toolset (v3.11)
        run: choco install wixtoolset -y

      - name: Harvest files with Heat
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          & "$wix\heat.exe" dir "out\publish" `
            -dr INSTALLDIR `
            -cg AppFiles `
            -gg -sfrag -srd -sreg `
            -var var.SourceDir `
            -out installer\wix\Files.wxs
      
      - name: Build MSI (candle + light)
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          New-Item -ItemType Directory -Force -Path obj, dist | Out-Null
          & "$wix\candle.exe" `
            -dSourceDir="out\publish" `
            -dProductVersion="${{ steps.v.outputs.NUM }}" `
            -out obj\ `
            installer\wix\Product.wxs installer\wix\Files.wxs
          & "$wix\light.exe" `
            -ext WixUIExtension -ext WixUtilExtension `
            -cultures:en-us `
            -out "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}.msi" `
            obj\Product.wixobj obj\Files.wixobj

      - name: Checksums
        run: |
          certutil -hashfile "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}.msi" SHA256 > "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}.msi.sha256.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist\*

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.NUM }}
          name: Win11 Extra Clock ${{ steps.v.outputs.NUM }}
          generate_release_notes: true
          draft: false
          allowUpdates: true
          files: |
            dist/Win11ExtraClock-x64-*.msi
            dist/Win11ExtraClock-x64-*.msi.sha256.txt
