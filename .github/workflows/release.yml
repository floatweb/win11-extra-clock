name: Release

on:
  push:
    tags:
      - 'v*'                 # rulează automat când împingi un tag vX.Y.Z
  workflow_dispatch:         # sau manual din UI

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_PATH: 'Win11 Extra Clock.csproj'   # <<< schimbă dacă ai alt path
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: v
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "NUM=$v" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify versions (tag vs csproj vs version.txt)
        shell: pwsh
        run: |
          $tag = "${{ steps.v.outputs.NUM }}"
          $proj = [xml](Get-Content "${{ env.PROJECT_PATH }}")
          $csprojVer = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          $txt = (Get-Content "version.txt" -Raw).Trim()
          Write-Host "Tag: $tag  |  csproj: $csprojVer  |  version.txt: $txt"
          if ($csprojVer -ne $tag -or $txt -ne $tag) {
            Write-Error "Version mismatch. Keep tag, csproj <Version>, and version.txt identical."; exit 1
          }

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o out/publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Inno)
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp
          /DMyAppVersion=${{ steps.v.outputs.NUM }}
          /DSourceDir="${{ github.workspace }}\out\publish"
          /DOutDir="${{ github.workspace }}\dist"
          installer\Win11ExtraClock.iss

      - name: Portable zip (optional)
        run: |
          mkdir dist
          Compress-Archive -Path out\publish\* -DestinationPath dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}-portable.zip

      - name: Checksums
        run: |
          certutil -hashfile "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}-Setup.exe" SHA256 > "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}-Setup.exe.sha256.txt"
          if (Test-Path "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}-portable.zip") {
            certutil -hashfile "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}-portable.zip" SHA256 > "dist\Win11ExtraClock-x64-${{ steps.v.outputs.NUM }}-portable.zip.sha256.txt"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist\*

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Win11ExtraClock-x64-*-Setup.exe
            dist/Win11ExtraClock-x64-*-Setup.exe.sha256.txt
            dist/Win11ExtraClock-x64-*-portable.zip
            dist/Win11ExtraClock-x64-*-portable.zip.sha256.txt
          draft: false
          generate_release_notes: true
