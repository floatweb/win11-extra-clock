name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_PATH: 'Win11 Extra Clock.csproj'
      NSIS_SCRIPT: 'installer/nsis/installer.nsi'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify versions (csproj vs version.txt)
        shell: pwsh
        run: |
          $proj = [xml](Get-Content '${{ env.PROJECT_PATH }}')
          $csprojVer = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | ? { $_ } | Select-Object -First 1)
          $txt = (Get-Content 'version.txt' -Raw).Trim()
          Write-Host "Version  csproj: $csprojVer  |  version.txt: $txt"
          if ($csprojVer -ne $txt) { throw 'Version mismatch' }

      - name: Restore & Publish (win-x64)
        shell: pwsh
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o out/publish

# Installer

      - name: List publish output (location + files)
        shell: pwsh
        run: |
          Write-Host "Repo root: $PWD"
          $p = Resolve-Path "out\publish"
          Write-Host "Publish folder: $p"
          Get-ChildItem $p -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Detect EXE name
        id: props
        shell: pwsh
        run: |
          $asm = (dotnet msbuild "${{ env.PROJECT_PATH }}" -getProperty:AssemblyName).Trim()
          if (-not $asm) { $asm = "Win11 Extra Clock" }
          $exe = Join-Path (Resolve-Path "out\publish") "$asm.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "Expected EXE not found at: $exe"
            throw "App EXE not found. Ensure <OutputType>WinExe</OutputType> and <UseAppHost>true</UseAppHost> in csproj."
          }
          echo "ASM=$asm" >> $env:GITHUB_OUTPUT

      - name: Install WiX 5 (+ v5 extensions)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          wix --version

          $exts = @('WixToolset.UI.wixext','WixToolset.Util.wixext')
          $try = @('5.0.2','5.0.1','5.0.0')

          foreach ($e in $exts) {
            $ok = $false
            foreach ($v in $try) {
              Write-Host ">> Installing $e/$v ..."
              try {
                wix extension add -g "$e/$v" 2>$null
                $ok = $true
                break
              } catch { }
            }
            if (-not $ok) { throw "Could not install $e in version v5.x (tried: $($try -join ', '))." }
          }

          wix extension list -g

      - name: Stage payload for WiX
        shell: pwsh
        run: |
          $pub = Resolve-Path "$PWD\out\publish"
          $payload = "$PWD\installer\payload"
          if (Test-Path $payload) { Remove-Item $payload -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
      
          Copy-Item "$pub\*" $payload -Recurse -Force
      
          Write-Host "Payload staged at: $payload"
          $cnt = (Get-ChildItem $payload -Recurse -File).Count
          Write-Host "Files in payload: $cnt"
          Get-ChildItem $payload -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Build MSI (WiX 5)
        shell: pwsh
        run: |
          $Version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ([string]::IsNullOrWhiteSpace($Version)) { throw "Version could not be determined." }
      
          $PubDir = (Resolve-Path "$PWD\out\publish").Path
          $Payload = (Resolve-Path "$PWD\installer\payload").Path
          
          $Asm    = (dotnet msbuild '${{ env.PROJECT_PATH }}' -getProperty:AssemblyName).Trim()
          if (-not $Asm) { $Asm = 'Win11 Extra Clock' }
      
          $License = (Resolve-Path "$PWD\installer\assets\license.rtf").Path
          $Icon    = (Resolve-Path "$PWD\installer\assets\win11_extra_clock_icon.ico" -ErrorAction SilentlyContinue)
      
          $MsiOut  = "$PWD\dist\Win11ExtraClock-x64-$Version.msi"
          New-Item -ItemType Directory -Force -Path (Split-Path $MsiOut) | Out-Null

          Write-Host "Payload location: $Payload"
          Get-ChildItem "$Payload" -Recurse | Select-Object FullName,Length | Format-Table -AutoSize
          Write-Host "License location: $License"
          Write-Host "Icon location: $Icon"
      
          if ($Icon) {
            wix build installer\wix\Product.wxs installer\wix\Files.wxs `
              -arch x64 `
              -ext WixToolset.UI.wixext `
              -ext WixToolset.Util.wixext `
              -define ProductVersion="$Version" `
              -define AppExeName="$Asm.exe" `
              -define LicenseRtf="$License" `
              -define AppIconPath="$Icon" `
              -bindpath Payload="$Payload" `
              -o "$MsiOut"
          } else {
            wix build installer\wix\Product.wxs installer\wix\Files.wxs `
              -arch x64 `
              -ext WixToolset.UI.wixext `
              -ext WixToolset.Util.wixext `
              -define ProductVersion="$Version" `
              -define AppExeName="$Asm.exe" `
              -define LicenseRtf="$License" `
              -bindpath Payload="$Payload" `
              -o "$MsiOut"
          }
      
          Get-Item "$MsiOut" | Select-Object FullName,Length | Format-Table -AutoSize
      
      - name: Generate MSI checksum & upload dist
        shell: pwsh
        run: |
          $msi = Get-Item "dist\Win11ExtraClock-x64-${{ github.event.inputs.version }}.msi"
          $hash = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash
          "$hash  $($msi.Name)" | Out-File -Encoding ASCII "$($msi.FullName).sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

# Release
  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "NUM=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "NUM=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ github.event.inputs.version }}
          name: Win11 Extra Clock ${{ github.event.inputs.version }}
          generate_release_notes: true
          make_latest: true
          draft: false
          files: |
            dist/Win11ExtraClock-x64-*.msi
            dist/Win11ExtraClock-x64-*.msi.sha256.txt
