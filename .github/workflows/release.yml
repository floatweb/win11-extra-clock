name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_PATH: 'Win11 Extra Clock.csproj'
      NSIS_SCRIPT: 'installer/nsis/installer.nsi'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"  # like v1.2.3
            $v = $tag.TrimStart('v')
          }
          if (-not $v) { throw "Version could not be determined." }
          echo "NUM=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Restore & Publish (win-x64)
        shell: pwsh
        run: |
          dotnet restore
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r win-x64 `
            -p:SelfContained=true -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:UseAppHost=true `
            -o out\publish

      - name: List publish output (location + files)
        shell: pwsh
        run: |
          Write-Host "Repo root: $PWD"
          $p = Resolve-Path "out\publish"
          Write-Host "Publish folder: $p"
          if (-not (Test-Path $p)) { throw "Publish folder not found: $p" }
          Get-ChildItem $p -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Detect EXE name from project
        id: props
        shell: pwsh
        run: |
          $asm = (dotnet msbuild "${{ env.PROJECT_PATH }}" -getProperty:AssemblyName).Trim()
          if (-not $asm) { $asm = "Win11 Extra Clock" }
          $exe = Join-Path (Resolve-Path "out\publish") "$asm.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "!! EXE not found at expected path: $exe"
            throw "App EXE not found. Ensure <OutputType>WinExe</OutputType> and <UseAppHost>true</UseAppHost>."
          }
          echo "ASM=$asm" >> $env:GITHUB_OUTPUT
          echo "EXE=$exe" >> $env:GITHUB_OUTPUT
          Write-Host "EXE detected: $exe"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          makensis -VERSION

      - name: Build NSIS setup
        shell: pwsh
        run: |
          $pub  = (Resolve-Path "out\publish").Path
          $ver  = "${{ steps.v.outputs.NUM }}"
          $asm  = "${{ steps.props.outputs.ASM }}"
          $rtf  = (Resolve-Path "installer\assets\license.rtf").Path
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $outfile = (Resolve-Path "dist").Path + "\Win11ExtraClock-x64-$ver-setup.exe"

          makensis /V4 `
            "/DAPP_VERSION=$ver" `
            "/DAPP_NAME=Win11 Extra Clock" `
            "/DCOMPANY=Float Web" `
            "/DPUBLISH_DIR=$pub" `
            "/DEXE_NAME=$asm.exe" `
            "/DLICENSE_RTF=$rtf" `
            "/DOUTFILE=$outfile" `
            "${{ env.NSIS_SCRIPT }}"

          Write-Host "Built:"
          Get-Item $outfile | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$hash  $($_.Name)" | Out-File -Encoding ASCII "$($_.FullName).sha256.txt"
          }
          Get-ChildItem dist | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "NUM=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "NUM=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.v.outputs.NUM }}
          name: Win11 Extra Clock ${{ steps.v.outputs.NUM }}
          generate_release_notes: true
          make_latest: true
          draft: false
          files: |
            dist/Win11ExtraClock-x64-*-setup.exe
            dist/Win11ExtraClock-x64-*-setup.exe.sha256.txt
