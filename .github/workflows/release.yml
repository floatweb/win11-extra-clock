name: Release
permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT_PATH: 'Win11 Extra Clock.csproj'
      NSIS_SCRIPT: 'installer/nsis/installer.nsi'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify versions (csproj vs version.txt)
        shell: pwsh
        run: |
          $proj = [xml](Get-Content '${{ env.PROJECT_PATH }}')
          $csprojVer = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | ? { $_ } | Select-Object -First 1)
          $txt = (Get-Content 'version.txt' -Raw).Trim()
          Write-Host "Version  csproj: $csprojVer  |  version.txt: $txt"
          if ($csprojVer -ne $txt) { throw 'Version mismatch' }

      - name: Restore & Publish (win-x64)
        shell: pwsh
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o out/publish

# Installer

      - name: List publish output
        shell: pwsh
        run: |
          Write-Host "Repo root: $PWD"
          $p = Resolve-Path "out\publish"
          Write-Host "Publish: $p"
          Get-ChildItem $p -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Stage IFW packages (copy payload)
        shell: pwsh
        run: |
          $pkgRoot = "installer\ifw\packages\com.floatweb.win11extraclock"
          $dataDir = Join-Path $pkgRoot "data"
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          Copy-Item "out\publish\*" $dataDir -Recurse -Force

          Write-Host "Payload staged at: $dataDir"
          Get-ChildItem $dataDir -Recurse | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Install Qt Installer Framework
        shell: pwsh
        run: |
          choco install qt-installer-framework -y --no-progress | Out-Host
      
          $bc = $null
          $cmd = Get-Command binarycreator.exe -ErrorAction SilentlyContinue
          if ($cmd) { $bc = $cmd.Source }
      
          if (-not $bc) {
            $bc = Get-ChildItem "C:\Qt\QtIFW-*\bin\binarycreator.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $bc) {
            $bc = Get-ChildItem "C:\Program Files*\Qt Installer Framework*\bin\binarycreator.exe" -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $bc) {
            python -m pip install --upgrade pip
            python -m pip install aqtinstall
            $ifwVer = '4.7.0'
            python -m aqt tool windows desktop tools_ifw $ifwVer --outputdir "$env:RUNNER_TEMP\Qt"
      
            $bc = Get-ChildItem "$env:RUNNER_TEMP\Qt" -Recurse -Filter binarycreator.exe -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          }
      
          if (-not $bc) { throw "binarycreator.exe not found (QtIFW) after choco/aqtinstall." }
      
          Write-Host "binarycreator: $bc"
          "$bc" | Out-File -Encoding ASCII "$env:RUNNER_TEMP\binarycreator.txt"

      - name: Templatize IFW config & package metadata
        shell: pwsh
        run: |
          $ver = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "Version not determined." }
          $date = (Get-Date -Format 'yyyy-MM-dd')
      
          (Get-Content 'installer/ifw/config/config.xml' -Raw).
            Replace('@VERSION@', $ver) |
            Set-Content 'installer/ifw/config/config.build.xml' -Encoding UTF8
      
          $meta = 'installer/ifw/packages/com.floatweb.win11extraclock/meta'
          (Get-Content "$meta/package.xml" -Raw).
            Replace('@VERSION@', $ver).
            Replace('@RELEASE_DATE@', $date) |
            Set-Content "$meta/package.xml" -Encoding UTF8
      
          Copy-Item 'installer/assets/license.rtf' "$meta\license.rtf" -Force

      - name: Build installer (QtIFW)
        shell: pwsh
        run: |
          $bc = Get-Content "$env:RUNNER_TEMP\binarycreator.txt" -Raw
      
          $Version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($Version)) { throw "Version not determined." }
      
          $out = "dist\Win11ExtraClock-x64-$Version-setup.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
      
          & "$bc" -f `
            -c "installer\ifw\config\config.build.xml" `
            -p "installer\ifw\packages" `
            "$out"
      
          Get-Item $out | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Encoding ASCII "$($_.FullName).sha256.txt"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

# Release
  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "NUM=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "NUM=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ github.event.inputs.version }}
          name: Win11 Extra Clock ${{ github.event.inputs.version }}
          generate_release_notes: true
          make_latest: true
          draft: false
          files: |
            dist/Win11ExtraClock-x64-*-setup.exe
            dist/Win11ExtraClock-x64-*-setup.exe.sha256.txt
